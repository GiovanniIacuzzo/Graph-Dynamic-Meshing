[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdm"
version = "0.3.0"
description = "Controlled trajectory experiments for ALE finite element transport"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
learning = ["torch>=2.5"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=8.2", "pybind11>=2.11", "cmake>=3.20"]

[project.scripts]
gdm-transport = "gdm.transport.cli:main"
gdm-campaign = "gdm.transport.campaign:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["gdm*"]

[tool.setuptools.package-data]
gdm = ["*.so", "*.pyd", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
