name: gdm_env
channels:
  - conda-forge
  - defaults

dependencies:
  # Interprete Python
  - python=3.10
  - pip

  # Calcolo scientifico, algebra lineare e ottimizzazione numerica
  - numpy>=1.24.0,<2.0.0
  - scipy>=1.11.0

  # PyTorch su macOS (include il backend nativo MPS)
  - pytorch>=2.1.0
  - torchvision
  - torchaudio

  # Visualizzazione ed esportazione
  - matplotlib>=3.8.0

  # I/O e serializzazione
  - pyyaml>=6.0
  - h5py>=3.10.0

  # Testing
  - pytest>=7.4.0
  - pytest-cov>=4.1.0

  - pip:
      - tqdm>=4.66.0