# Stage E1: numerical verification, ALE-consistent SUPG and fixed-grid work-precision.
# All campaign artefacts are written below results/stage_e/.
experiment:
  name: stage_e1_numerical_verification_supg_work_precision
  seed: 2701
  output_dir: results/stage_e
  cpu_threads: 1

domain:
  x_min: 0.0
  x_max: 1.0
  y_min: 0.0
  y_max: 1.0
  # nx, ny denote cell subdivisions; the resulting structured P1 mesh has
  # (nx+1)(ny+1) vertices and 2 nx ny triangles.

pde:
  bx: 0.4
  by: 0.2
  nu: 0.001
  sigma: 0.06
  beta: 0.5
  T: 0.5

linear_solver:
  rel_tol: 1.0e-12
  abs_tol: 1.0e-14
  max_iterations: 4000
  gmres_krylov_dim: 50
  ssor_omega: 1.0
  use_direct_solver: false
  right_preconditioning: true
  ale_rhs_norm_floor: 0.0

stabilization:
  mode: galerkin
  c_time: 2.0
  c_advection: 2.0
  c_diffusion: 4.0

spatial_convergence:
  resolutions: [16, 32, 64]
  # The spatial table uses dt/4; temporal contamination is estimated from the
  # same-mesh Cauchy difference between dt/2 and dt/4 (Backward Euler, O(dt)).
  dt: 0.000625
  temporal_contamination_limit: 0.10

temporal_convergence:
  resolution: 32
  dts: [0.01, 0.005, 0.0025, 0.00125]
  reference_dt: 0.0003125

peclet:
  sample_times: [0.0, 0.125, 0.25, 0.375, 0.5]
  ale_motion_amplitude: 0.02
  motion_period: 0.5

supg_comparison:
  resolution: 32
  dt: 0.0025
  ale_motion_amplitude: 0.02
  compare_moving_ale: true

work_precision:
  resolutions: [16, 32, 64]
  dt: 0.0025
  warmup_runs: 1
  repetitions: 5
  modes: [galerkin, supg]

smoke_test:
  resolution: 8
  dt: 0.01
  repetitions: 1
  run_native_tests: false

closeout:
  output_dir: results/stage_e/closeout
  spatial_fine_dt: 0.0000390625
  temporal_contamination_limit: 0.10
  spatial_modes: [galerkin, supg]
  work_precision_warmups: 1
  work_precision_repetitions: 5
  supg_tau_audit:
    resolution: 32
    dt: 0.0025
    tau_scales: [0.5, 1.0, 2.0, 4.0]