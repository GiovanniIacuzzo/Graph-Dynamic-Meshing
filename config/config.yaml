# =============================================================================
# Graph-Dynamic Meshing (GDM) - Global Experiment Configuration
# File: config/config.yaml
# =============================================================================

experiment:
  name: "stage_a_gaussian_r_adaptivity"
  project: "graph_dynamic_meshing"
  seed: 42
  device: "mps"                 # 'cuda' o 'cpu'
  deterministic: false
  output_dir: "results/stage_a_oracle_v2"
  log_level: "INFO"

# -----------------------------------------------------------------------------
# 1. Geometria del Dominio e Parametri Mesh
# -----------------------------------------------------------------------------
geometry:
  domain:
    x_min: 0.0
    x_max: 1.0
    y_min: 0.0
    y_max: 1.0
  mesh_type: "unstructured_triangular"
  initial_grid:
    nx: 32                       # Risoluzione nominale di campionamento iniziale
    ny: 32
  nominal_nodes: 1089            # Nodi attesi (circa (nx+1)*(ny+1))
  safety:
    epsilon: 1.0e-4              # Soglia minima ammissibile per det(J_e)
    tol_deg: 1.0e-12             # Tolleranza degenerazione lineare per safety filter
    safety_margin: 1.0e-6        # Margine di arretramento precauzionale (1 - margin)*alpha
    tol_degenerate: 1.0e-14      # Soglia rilevamento triangoli degeneri

# -----------------------------------------------------------------------------
# 2. Campo Scalare Analitico di Riferimento (Gaussian Bump - Stage A)
# -----------------------------------------------------------------------------
field:
  type: "gaussian_bump_2d"
  default:
    mu_x: 0.5
    mu_y: 0.5
    sigma: 0.05
    amplitude: 1.0
  sampling_ranges:               # Intervalli per la generazione del dataset
    mu_x_min: 0.2
    mu_x_max: 0.8
    mu_y_min: 0.2
    mu_y_max: 0.8
    sigma_min: 0.03
    sigma_max: 0.08
    amplitude_min: 0.8
    amplitude_max: 1.2

# -----------------------------------------------------------------------------
# 3. Ottimizzatore Offline Variazionale (Oracle)
# -----------------------------------------------------------------------------
oracle:
  objective:
    lambda_D: 0.01               # Peso penalizzazione moto nodale: D(X) = ||X - X_0||_F^2 / N
    lambda_Q: 0.001              # Peso penalizzazione qualità geometrica: Q(X) = mean(1 - eta_e)
    norm_E_fallback: 1.0e-12     # Soglia numerica denominatore per normalizzazione E_interp
  optimizer:
    method: "L-BFGS-B"
    max_iter: 2000
    ftol: 1.0e-7
    gtol: 1.0e-5
    box_bounds:
      min: 0.0
      max: 1.0

# -----------------------------------------------------------------------------
# 4. Generazione e Partizionamento Dataset
# -----------------------------------------------------------------------------
dataset:
  raw_dir: "data/raw_oracle_v2"
  processed_dir: "data/processed"
  manifest_path: "data/manifest_oracle_v2.json"
  format: "pickle"               # 'pickle' con campioni serializzati
  splits:
    num_train: 120
    num_validation: 30
    num_test_interp: 30
    num_test_extrap: 30          # Parametri fuori dal range di addestramento
  extrapolation_ranges:
    sigma_extrap_low: [0.015, 0.025]   # Gradienti estremamente più ripidi
    sigma_extrap_high: [0.09, 0.12]    # Campi molto diffusi

# -----------------------------------------------------------------------------
# 5. Modello Graph Neural Network (GNN Mesh Mover)
# -----------------------------------------------------------------------------
model:
  name: "MeshMoverGNN"
  node_in_dim: 6                 # [x, y, u, grad_u_x, grad_u_y, is_boundary]
  edge_in_dim: 3                 # [dx, dy, ||dx||]
  out_dim: 2                     # [Delta_x, Delta_y]
  latent_dim: 128
  num_message_passing_steps: 6
  mlp_num_layers: 2

# -----------------------------------------------------------------------------
# 6. Addestramento (Training Pipeline)
# -----------------------------------------------------------------------------
training:
  epochs: 150
  batch_size: 8
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  lr_scheduler:
    type: "CosineAnnealingLR"
    T_max: 150
    eta_min: 1.0e-6
  loss_weights:
    w_target: 1.0                 # MSE su Delta X* (supervisione oracle)
    w_smooth: 0.0                 # Dirichlet energy / Laplacian smoothing su Delta X
    w_barrier: 0.0001             # Soft log-barrier loss durante il training: -ln(J_e / J_0)
  checkpoint_interval: 10
  early_stopping_patience: 25
  barrier_warmup_epochs: 20
  barrier_ramp_epochs: 20

# -----------------------------------------------------------------------------
# 7. Modulo Numerico PDE & Solutori Classici (Stage B - Benchmark MMS)
# -----------------------------------------------------------------------------
numerics:
  pde:
    type: "advection_diffusion_2d_mms"
    b_x: 1.0
    b_y: 0.5
    nu: 1.0e-3                   # Diffusività cinematica (regime convettivo dominante)
    sigma: 0.04
    amplitude: 1.0
    x0: 0.2
    y0: 0.2
    c_x: 0.6
    c_y: 0.3
  time_integration:
    t_start: 0.0
    t_end: 0.5
    dt: 0.005
    theta: 1.0                   # 1.0 = Implicit Euler, 0.5 = Crank-Nicolson
  fem:
    element_type: "P1"
    use_supg: true
    solver_type: "direct_sparse_lu"
  remap:
    mode: "conservative"         # 'conservative' (massa preservata) o 'standard' (pointwise)
    tol_bary: 1.0e-10

# -----------------------------------------------------------------------------
# 8. Valutazione e Benchmark Scientifico
# -----------------------------------------------------------------------------
evaluation:
  baselines:
    - "B0_fixed_mesh"
    - "B2_classical_r_adaptive"
    - "B3_gnn_mesh_mover"
    - "B4_gnn_with_safety_filter"
    - "B5_oracle"
  metrics:
    learning:
      - "displacement_l2_error"
      - "displacement_relative_error"
    geometry:
      - "min_jacobian"
      - "mean_jacobian"
      - "inverted_cells"
      - "mean_mesh_quality"
      - "max_aspect_ratio"
    physics:
      - "solution_l2_error"
      - "solution_h1_error"
      - "conservation_error"
      - "gcl_error"
    computational:
      - "gnn_time"
      - "safety_time"
      - "remap_time"
      - "fem_time"
      - "total_time"