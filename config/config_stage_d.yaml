# Stage D: trajectory-aware supervision for the Stage-C transient MMS problem.
experiment:
  name: stage_d_trajectory_aware_mms_r_adaptivity
  project: graph_dynamic_meshing
  seed: 1701
  device: mps
  deterministic: false
  output_dir: results/stage_d_trajectory_aware
  log_level: INFO
geometry:
  domain:
    x_min: 0.0
    x_max: 1.0
    y_min: 0.0
    y_max: 1.0
  mesh_type: unstructured_triangular
  initial_grid:
    nx: 32
    ny: 32
  nominal_nodes: 1089
  safety:
    epsilon: 0.0001
    tol_deg: 1.0e-12
    safety_margin: 1.0e-06
    tol_degenerate: 1.0e-14
field:
  type: gaussian_bump_2d
  default:
    mu_x: 0.5
    mu_y: 0.5
    sigma: 0.05
    amplitude: 1.0
  sampling_ranges:
    mu_x_min: 0.2
    mu_x_max: 0.8
    mu_y_min: 0.2
    mu_y_max: 0.8
    sigma_min: 0.03
    sigma_max: 0.08
    amplitude_min: 0.8
    amplitude_max: 1.2
oracle:
  objective:
    lambda_D: 0.01
    lambda_Q: 0.001
    norm_E_fallback: 1.0e-12
  optimizer:
    method: L-BFGS-B
    max_iter: 120
    ftol: 1.0e-07
    gtol: 1.0e-05
    box_bounds:
      min: 0.0
      max: 1.0
dataset:
  raw_dir: data/stage_d_trajectory_aware/raw
  processed_dir: data/stage_d_trajectory_aware/processed
  manifest_path: data/stage_d_trajectory_aware/raw/manifest.json
  format: pickle
  splits:
    num_train: 48
    num_validation: 12
    num_test_interp: 12
    num_test_extrap: 16
  extrapolation_ranges:
    sigma_extrap_low:
    - 0.015
    - 0.025
    sigma_extrap_high:
    - 0.09
    - 0.12
model:
  name: MeshMoverGNN
  node_in_dim: 6
  edge_in_dim: 3
  out_dim: 2
  latent_dim: 128
  num_message_passing_steps: 6
  mlp_num_layers: 2
training:
  epochs: 120
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 1.0e-05
  lr_scheduler:
    type: CosineAnnealingLR
    T_max: 120
    eta_min: 1.0e-06
  loss_weights:
    w_target: 1.0
    w_smooth: 0.0
    w_barrier: 0.0001
  checkpoint_interval: 10
  early_stopping_patience: 20
  barrier_warmup_epochs: 20
  barrier_ramp_epochs: 20
numerics:
  pde:
    type: advection_diffusion_2d_mms
    b_x: 1.0
    b_y: 0.5
    nu: 0.001
    sigma: 0.04
    amplitude: 1.0
    x0: 0.2
    y0: 0.2
    c_x: 0.6
    c_y: 0.3
  time_integration:
    t_start: 0.0
    t_end: 0.5
    dt: 0.005
    theta: 1.0
  fem:
    element_type: P1
    use_supg: true
    solver_type: direct_sparse_lu
  remap:
    mode: conservative
    tol_bary: 1.0e-10
evaluation:
  baselines:
  - B0_fixed_mesh
  - B2_classical_r_adaptive
  - B3_gnn_mesh_mover
  - B4_gnn_with_safety_filter
  - B5_oracle
  metrics:
    learning:
    - displacement_l2_error
    - displacement_relative_error
    geometry:
    - min_jacobian
    - mean_jacobian
    - inverted_cells
    - mean_mesh_quality
    - max_aspect_ratio
    physics:
    - solution_l2_error
    - solution_h1_error
    - conservation_error
    - gcl_error
    computational:
    - gnn_time
    - safety_time
    - remap_time
    - fem_time
    - total_time
stage_d:
  dt: 0.005
  adapt_interval: 10
  time_quadrature_order: 3
  pde:
    bx: 0.4
    by: 0.2
    nu: 0.001
    T: 0.5
  splits:
    train:
      count: 48
      sigma:
      - 0.035
      - 0.075
      beta:
      - 0.3
      - 0.7
    validation:
      count: 12
      sigma:
      - 0.035
      - 0.075
      beta:
      - 0.3
      - 0.7
    test_interp:
      count: 12
      sigma:
      - 0.04
      - 0.07
      beta:
      - 0.35
      - 0.65
    test_extrap:
      count: 16
      sigma_extrap_low:
      - 0.022
      - 0.032
      sigma_extrap_high:
      - 0.085
      - 0.105
      beta:
      - 0.25
      - 0.75
