experiment:
  name: stage_d_trajectory_self_supervised
  project: graph_dynamic_meshing
  seed: 2701
  device: mps
  deterministic: false
  output_dir: results/stage_d_selfsupervised
  log_level: INFO
features:
  normalize_field_scale: true
geometry:
  domain:
    x_min: 0.0
    x_max: 1.0
    y_min: 0.0
    y_max: 1.0
  mesh_type: unstructured_triangular
  initial_grid:
    nx: 32
    ny: 32
  nominal_nodes: 1089
  safety:
    epsilon: 0.0001
    tol_deg: 1.0e-12
    safety_margin: 1.0e-06
    tol_degenerate: 1.0e-14
field:
  type: transient_mms_gaussian_sine
  sampling_ranges:
    sigma_min: 0.035
    sigma_max: 0.075
    beta_min: 0.3
    beta_max: 0.7
    sigma_extrap_low:
    - 0.022
    - 0.032
    sigma_extrap_high:
    - 0.085
    - 0.105
    beta_extrap:
    - 0.25
    - 0.75
dataset:
  raw_dir: data/stage_d_selfsupervised/raw
  format: pickle
  mesh_perturb_fraction: 0.08
  splits:
    train: 128
    validation: 24
    test_interp: 24
    test_extrap: 32
model:
  name: MeshMoverGNN
  node_in_dim: 6
  edge_in_dim: 3
  out_dim: 2
  latent_dim: 64
  num_message_passing_steps: 4
  mlp_num_layers: 2
  max_displacement: 0.05
training:
  epochs: 120
  batch_size: 2
  learning_rate: 0.0003
  weight_decay: 1.0e-05
  lr_scheduler:
    type: CosineAnnealingLR
    T_max: 120
    eta_min: 1.0e-06
  early_stopping_patience: 20
  grad_clip_norm: 1.0
  objective:
    lambda_D: 0.01
    lambda_Q: 0.001
    barrier_weight: 1.0
    relative_jacobian_floor: 0.15
    time_quadrature_order: 3
    w_smooth: 0.0001
  cpu_num_threads: 1
stage_d:
  dt: 0.005
  adapt_interval: 10
  pde:
    bx: 0.4
    by: 0.2
    nu: 0.001
    T: 0.5

# Required only if the Stage-C campaign is run with its optional oracle-ALE baseline.
oracle:
  objective:
    lambda_D: 0.01
    lambda_Q: 0.001
