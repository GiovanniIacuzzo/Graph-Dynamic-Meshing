# GDM Stage B — native transient FEM/ALE baseline campaign.
experiment:
  name: stage_b_native_transient_fem_ale_benchmark
  project: graph_dynamic_meshing
  seed: 42
  device: cpu
  deterministic: true
  output_dir: results/stage_b_v4
  log_level: INFO
geometry:
  domain:
    x_min: 0.0
    x_max: 1.0
    y_min: 0.0
    y_max: 1.0
  mesh_type: unstructured_triangular
  initial_grid:
    nx: 32
    ny: 32
  nominal_nodes: 1089
  safety:
    epsilon: 0.0001
    tol_deg: 1.0e-12
    safety_margin: 1.0e-06
    tol_degenerate: 1.0e-14
oracle:
  objective:
    lambda_D: 0.01
    lambda_Q: 0.001
    quadrature_rule: dunavant_7_composite
    quadrature_subdivision_level: 2
model:
  name: MeshMoverGNN
  node_in_dim: 6
  edge_in_dim: 3
  out_dim: 2
  latent_dim: 128
  num_message_passing_steps: 6
  mlp_num_layers: 2
