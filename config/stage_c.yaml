# GDM Stage C — repeated transient PDE benchmark and transfer-operator study.
experiment:
  name: stage_c_repeated_end_to_end_pde_benchmark
  project: graph_dynamic_meshing
  seed: 42
  device: cpu
  deterministic: true
  output_dir: results/stage_c_v4
  log_level: INFO
geometry:
  domain:
    x_min: 0.0
    x_max: 1.0
    y_min: 0.0
    y_max: 1.0
  mesh_type: unstructured_triangular
  initial_grid:
    nx: 32
    ny: 32
  nominal_nodes: 1089
  safety:
    epsilon: 0.0001
    tol_deg: 1.0e-12
    safety_margin: 1.0e-06
    tol_degenerate: 1.0e-14
oracle:
  objective:
    lambda_D: 0.01
    lambda_Q: 0.001
    quadrature_rule: dunavant_7_composite
    quadrature_subdivision_level: 2
model:
  name: MeshMoverGNN
  node_in_dim: 6
  edge_in_dim: 3
  out_dim: 2
  latent_dim: 128
  num_message_passing_steps: 6
  mlp_num_layers: 2
numerics:
  pde:
    type: advection_diffusion_2d_mms
    b_x: 1.0
    b_y: 0.5
    nu: 0.001
    sigma: 0.04
    amplitude: 1.0
    x0: 0.2
    y0: 0.2
    c_x: 0.6
    c_y: 0.3
  time_integration:
    t_start: 0.0
    t_end: 0.5
    dt: 0.005
    theta: 1.0
  fem:
    element_type: P1
    use_supg: true
    solver_type: direct_sparse_lu
  remap:
    mode: conservative
    tol_bary: 1.0e-10
