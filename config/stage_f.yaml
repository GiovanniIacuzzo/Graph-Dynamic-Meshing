# Stage F1: classical r-refinement versus learned GDM mesh movement.
# Physical PDE/ALE and safety filtering remain in C++20/deal.II.
experiment:
  name: stage_f1_classical_r_refinement_vs_gdm
  seed: 3701
  # A separate directory is mandatory for the buffered-filter campaign.
  output_dir: results/stage_f1_buffered
  cpu_threads: 1

source:
  config: config/stage_d.yaml
  numerics_config: config/stage_e.yaml
  gdm_checkpoint: results/stage_d_trajectory_aware/checkpoints/best_model.pt

protocol:
  nx: 32
  ny: 32
  dt: 0.005
  adapt_interval: 10
  warmup_runs: 1
  repetitions: 5
  validation_split: validation
  test_splits: [test_interp, test_extrap]

classical_r:
  # The only validation-tuned quantity is monitor_strength; q, theta and
  # pseudo-time integration settings are fixed before inspecting test results.
  monitor_strength_candidates: [0.01, 0.025, 0.05, 0.1]
  hessian_monitor_strength_candidates: [0.0001, 0.0005, 0.001, 0.005]
  monitor_types: [winslow, arclength, hessian]
  q: 2
  theta: 0.25
  monitor_smoothing_passes: 1
  smoothing_weight: 0.5
  metric_eigenvalue_min: 1.0
  metric_eigenvalue_max: 50.0
  pseudo_iterations: 200
  max_move_fraction: 0.10
  armijo: 1.0e-4
  max_backtracking: 16
  relative_energy_tolerance: 1.0e-8

statistics:
  bootstrap_samples: 10000
  confidence_level: 0.95

safety:
  epsilon: 0.0001
  safety_margin: 0.000001
  tol_deg: 1.0e-12
  relative_jacobian_margin: 1.0e-9
